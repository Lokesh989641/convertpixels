<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image to PDF Converter - ConvertPixels</title>
    <meta
        name="description"
        content="Convert JPG, PNG and other images to PDF online for free with ConvertPixels."
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="../index.html" class="logo">ConvertPixels</a>

        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../index.html#tools">Tools</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </nav>
</header>

<main class="converter-page">

    <h1>Image to PDF Converter</h1>

    <p class="converter-description">
        Convert JPG and PNG images into a PDF file for free.
    </p>

    <div class="converter-box">

        <label for="imageInput" class="upload-area">
            <span>📄</span>
            <strong>Choose images</strong>
            <small>Select one or multiple JPG or PNG images</small>
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png"
            multiple
        >

        <div id="preview"></div>

        <button id="convertBtn" disabled>
            Convert to PDF
        </button>

        <a
            id="downloadBtn"
            class="download-btn"
            style="display:none;"
        >
            Download PDF
        </a>

    </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script src="../js/image-to-pdf.js"></script>

</body>
</html>
