<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JPG to WebP Converter - ConvertPixels</title>
    <meta name="description" content="Convert JPG images to WebP online for free with ConvertPixels.">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="../index.html" class="logo">ConvertPixels</a>

        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../index.html#tools">Tools</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </nav>
</header>

<main class="converter-page">

    <h1>JPG to WebP Converter</h1>

    <p class="converter-description">
        Convert JPG images to WebP format quickly and for free.
    </p>

    <div class="converter-box">

        <label for="imageInput" class="upload-area">
            <span>📁</span>
            <strong>Choose a JPG image</strong>
            <small>Click here to select your JPG file</small>
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/jpeg"
        >

        <div id="preview"></div>

        <button id="convertBtn" disabled>
            Convert to WebP
        </button>

        <a
            id="downloadBtn"
            class="download-btn"
            style="display:none;"
        >
            Download WebP
        </a>

    </div>

</main>

<script src="../js/jpg-to-webp.js"></script>

</body>
</html>
